name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: 构建 .spmod
        working-directory: plugin
        run: gradle plugin --no-daemon

      - name: 收集 .spmod
        run: |
          mkdir -p dist
          cp plugin/build/libs/*.spmod dist/SPW-Send-${GITHUB_REF_NAME}.spmod

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-spmod
          path: dist/*.spmod
          if-no-files-found: error

  publish:
    needs: [plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 只覆盖当前 tag 的同名 Release，随后清理其他所有旧版本
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SPW-Send ${GITHUB_REF_NAME}" \
            --notes "椒盐音乐模组：电脑 → MySend 安卓端单向音乐同步。安卓端请使用 MySend 发布的 APK。" \
            --latest

      # 仓库只保留当前版本：删除其余 Release 并同时清理对应 tag
      # 仅 tag 触发时执行，避免手动从 main 运行时误删当前 Release
      - name: 清理旧版本
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "${GITHUB_REF_NAME}" ]; then
              continue
            fi
            gh release delete "$tag" --yes --cleanup-tag
          done
