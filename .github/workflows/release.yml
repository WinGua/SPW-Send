name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: 构建 .spmod
        working-directory: plugin
        run: gradle plugin --no-daemon

      - name: 收集 .spmod
        run: |
          mkdir -p dist
          cp plugin/build/libs/*.spmod dist/SPW-Send-${GITHUB_REF_NAME}.spmod

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-spmod
          path: dist/*.spmod
          if-no-files-found: error

  publish:
    needs: [plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 只覆盖当前 tag 的同名 Release，保留其他历史版本
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SPW-Send ${GITHUB_REF_NAME}" \
            --notes "椒盐音乐模组：电脑 → MySend 安卓端单向音乐同步。安卓端请使用 MySend 发布的 APK。" \
            --latest
