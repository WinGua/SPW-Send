name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 local.properties
        run: |
          FLUTTER_SDK="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/spw-send-release.keystore
          fi

      - name: 构建 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SPW-Send-${GITHUB_REF_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: 构建 .spmod
        working-directory: plugin
        run: gradle plugin --no-daemon

      - name: 收集 .spmod
        run: |
          mkdir -p dist
          cp plugin/build/libs/*.spmod dist/SPW-Send-${GITHUB_REF_NAME}.spmod

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-spmod
          path: dist/*.spmod
          if-no-files-found: error

  publish:
    needs: [android, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SPW-Send ${GITHUB_REF_NAME}" \
            --notes "PC（椒盐音乐模组）→ Android 单向音乐同步。详见 README 与 docs/PROTOCOL.md。" \
            --latest
