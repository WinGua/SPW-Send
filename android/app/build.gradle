plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.wingua.spwsend"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.wingua.spwsend"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // CI 通过 ANDROID_KEYSTORE_B64 解码到 keystore/，本地无密钥时自动回退 debug 签名。
            def keystoreFile = file('../../keystore/spw-send-release.keystore')
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
                keyAlias = System.getenv('ANDROID_KEYSTORE_ALIAS') ?: 'spw-send'
                keyPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release.storeFile != null
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
