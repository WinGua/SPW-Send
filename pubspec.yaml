name: spw_send
description: SPW-Send 安卓端（椒盐音乐创意工坊模组配套）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  # 8.3.3+ 要求 lifecycle ^2.0.22，与本工程的兼容锁定冲突，故固定在 8.3.2。
  file_picker: 8.3.2
  # 固定 4.9.x：更高版本的 API / SDK 约束与 Flutter 3.24.5 不兼容。
  fluent_ui: 4.9.2
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  # 高版本生命周期插件要求更高 AGP / compileSdk，锁定到与 AGP 8.5.2 兼容的版本。
  flutter_plugin_android_lifecycle: 2.0.21

flutter:
  uses-material-design: true
